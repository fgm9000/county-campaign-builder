[project]
name = "county-campaign-builder"
version = "0.1.0"
description = "County-level lead-gen campaign builder: verified local facts, auction math in code, compliance checks and a human review list"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Fabio Moura" }
]
dependencies = [
    "anthropic==2.13.0",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "langgraph==1.2.22",
    "openpyxl==3.1.5",
    "polars==2.1.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/county_campaign_builder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"evals/**/*.py" = ["S101"]
"scripts/**/*.py" = ["E402", "S603", "S404"]

[tool.mypy]
strict = true
files = ["src", "tests", "evals"]
python_version = "3.12"
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
# DeepEval's BaseMetric has an untyped `__init_subclass__`; subclassing it trips this check.
module = ["evals.metrics"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# openpyxl ships without py.typed or bundled type stubs.
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "deepeval==4.3.4",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]
